services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/workspace:cached
      - ${USERPROFILE:-$HOME}/.ssh:/root/.ssh
      - ${USERPROFILE:-$HOME}/.gitconfig:/root/.gitconfig:ro
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      redis:
        condition: service_healthy
    # Starts the dev server (with hot reload) as soon as the container starts and keeps the
    # container up even if the server fails to start; see scripts/dev-start.sh.
    command: ["bash", "/workspace/scripts/dev-start.sh"]
    init: true

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
