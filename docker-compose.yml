services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/workspace:cached
      - ${USERPROFILE:-$HOME}/.ssh:/root/.ssh
      - ${USERPROFILE:-$HOME}/.gitconfig:/root/.gitconfig:ro
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      redis:
        condition: service_healthy
    command: sleep infinity

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
