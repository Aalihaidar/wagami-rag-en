# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Every ecosystem opens PRs against `develop` (never `main`). Dependabot reads
# THIS file from the repository's default branch, so once `develop` exists it
# must be set as the default branch (or this file merged there) for these
# configs to take effect. `develop` must exist before the first run.
#
# Every pinned version in the repo is covered by one ecosystem below:
#   uv              pyproject.toml + uv.lock
#   docker          docker/Dockerfile.* (the python base image and the uv image)
#   docker-compose  docker-compose.yml (redis)
#   github-actions  .github/workflows/* (SHA pins + version comments)
#   devcontainers   .devcontainer/devcontainer.json (+ devcontainer-lock.json)
#   pre-commit      .pre-commit-config.yaml (hook revs)
# Debian packages inside the images are not a Dependabot ecosystem; the prod
# image's `apt-get upgrade` step (docker/Dockerfile.prod) covers those.
#
# Cooldown: a version update is proposed only once the release is 7 days old,
# so a compromised or broken release is usually caught (and yanked) upstream
# before it reaches a PR. Security updates are never delayed by it.
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python — uv (pyproject.toml + uv.lock), all groups (dev + notebook too)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    # Only bump the pyproject floor when the current constraint can't satisfy
    # the new version; otherwise just refresh uv.lock.
    versioning-strategy: "increase-if-necessary"
    # Direct AND indirect (transitive) dependencies, every update type.
    allow:
      - dependency-type: "all"
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      # Minor + patch across everything land as one PR to cut review noise.
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    # Majors are deliberately NOT grouped — each breaking bump gets its own PR.

  # ---------------------------------------------------------------------------
  # Docker — docker/Dockerfile.dev and docker/Dockerfile.prod (FROM lines: the
  # python base image and the uv image, each pinned to a digest)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/docker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  # ---------------------------------------------------------------------------
  # Docker Compose — docker-compose.yml at the root (the redis service image).
  # Its own ecosystem: the "docker" one reads Dockerfiles, not compose files.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-compose:
        patterns: ["*"]

  # ---------------------------------------------------------------------------
  # GitHub Actions — SHA pins in .github/workflows/*; bumps SHA + version comment
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]

  # ---------------------------------------------------------------------------
  # Dev container — .devcontainer/devcontainer.json feature versions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: ["dependencies", "devcontainer"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      devcontainers:
        patterns: ["*"]

  # ---------------------------------------------------------------------------
  # pre-commit — hook revs in .pre-commit-config.yaml. The ruff hook's rev is
  # meant to match the ruff version in uv.lock: its bump arrives here and ruff's
  # own in the uv group PR, on the same Monday — merge the two together.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pre-commit"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels: ["dependencies", "pre-commit"]
    commit-message:
      prefix: "chore(dev-deps)"
    groups:
      pre-commit-hooks:
        patterns: ["*"]
