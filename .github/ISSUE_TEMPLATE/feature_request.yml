name: Feature / task
description: Propose a change or a new piece of work.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What need does this address? Link related issues.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should happen? Note any schema, data-contract, or API impact.
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Which phase does this belong to?
      options:
        - "Phase 1 — knowledge base + Weaviate ingestion"
        - "Retrieval-prototyping notebook"
        - "app/ — FastAPI + agent + retrieval tool"
        - "Production — Dockerfile.prod, CI/CD, deploy"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
