name: Build & Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # main -> production, develop -> staging. This filter matches the CI run's
    # head branch, so it also passes CI runs for a pull request whose head is
    # develop (the develop -> main release PR); build-and-push below only acts
    # on CI runs for a push, which on these ruleset-protected branches
    # (.github/CONTRIBUTING.md §2) always means a merged PR.
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to GHCR?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      force_rebuild:
        description: "Bypass layer cache (full rebuild)"
        required: false
        type: boolean
        default: false

concurrency:
  # One queue per target branch. Under workflow_run, github.ref is always the
  # default branch, so keying on it put staging and production builds in one
  # group, where a newer pending run replaces an older pending one.
  group: docker-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

# Least privilege at the top; the build job widens its own scopes below.
permissions:
  contents: read

jobs:
  # Gate the build on docker/Dockerfile.prod existing so a checkout that
  # somehow lacks it (or a future revert) no-ops this workflow cleanly
  # instead of failing the build step.
  detect:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      has_prod_dockerfile: ${{ steps.check.outputs.has_prod_dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: echo "has_prod_dockerfile=$([ -f docker/Dockerfile.prod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Production Image
    needs: detect
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push image to GHCR
      security-events: write   # upload Trivy SARIF
      id-token: write          # keyless signing / provenance attestation
    # A workflow_run build needs a green CI run for a push (a merge) made in
    # this repository. CI runs for pull requests are skipped: the release PR's
    # head is develop, so its CI run would otherwise rebuild and redeploy the
    # commit develop's own merge already shipped.
    if: >
      needs.detect.outputs.has_prod_dockerfile == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      primary-tag: ${{ steps.meta.outputs.json && fromJSON(steps.meta.outputs.json).tags[0] }}
      # Which environment this build is for: 'main' -> production, 'develop'
      # -> staging. Resolved once here so both deploy jobs below branch on it
      # without re-deriving it from two different event shapes themselves.
      target-branch: ${{ steps.target.outputs.branch }}

    steps:
      # Under workflow_run, github.sha and github.ref point at the default
      # branch's latest commit, not the commit CI tested, so a main build
      # would otherwise check out develop. Build exactly the commit CI passed;
      # a manual dispatch checks out the ref it was started on.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Resolve target branch and commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # workflow_run doesn't put the triggering branch on github.ref_name
          # (that's always the default branch); workflow_dispatch does.
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            branch="$RUN_HEAD_BRANCH"
            # Checking out a bare SHA leaves a detached HEAD with no branch
            # refs, and metadata-action's git context cannot infer a ref from
            # that ("Cannot infer ref from detached HEAD"). Name the tested
            # commit after its branch, without moving it.
            git check-ref-format --branch "$branch" > /dev/null
            git switch --quiet --force-create "$branch"
          else
            branch="$REF_NAME"
          fi
          {
            echo "branch=$branch"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags automatically lowercased)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Read the commit from the checkout above, so the sha- tag and the
          # revision label name the commit that was built, not github.sha.
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ steps.target.outputs.branch == 'main' }}
            type=raw,value=staging,enable=${{ steps.target.outputs.branch == 'develop' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: >-
            ${{
              github.event_name != 'workflow_dispatch' ||
              inputs.push_image == 'true'
            }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # A failed cache write (e.g. "failed to reserve cache" from GitHub's
          # cache service) must not fail a build whose image is complete; the
          # next build only runs with a colder cache.
          cache-to: type=gha,mode=max,ignore-error=true
          no-cache: ${{ inputs.force_rebuild == true }}
          provenance: true
          sbom: true

      - name: Scan image for vulnerabilities
        id: scan
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to Security tab
        if: always() && steps.scan.outcome == 'success'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Write job summary
        if: always() && steps.build.outcome == 'success'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COMMIT: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo "## 🐳 Production Image Build"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Image** | \`$IMAGE\` |"
            echo "| **Digest** | \`$DIGEST\` |"
            # metadata-action lists one tag per line; keep them in one table cell.
            echo "| **Tags** | \`${TAGS//$'\n'/, }\` |"
            echo "| **Platforms** | \`linux/amd64, linux/arm64\` |"
            echo "| **Commit** | \`$COMMIT\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # main -> production, develop -> staging (Section 1 / Section F of
  # docs/APP_AND_DEPLOYMENT_PLAN.md). Each is its own GitHub Environment so
  # the two deploy hook secrets stay scoped separately and either can get a
  # required-reviewer gate later without touching the other.
  deploy-staging:
    name: Trigger Render Deploy (staging)
    needs: build-and-push
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: >
      needs.build-and-push.result == 'success' &&
      needs.build-and-push.outputs.target-branch == 'develop'
    environment: staging
    steps:
      - name: Call Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_STAGING_DEPLOY_HOOK_URL not set — skipping deploy trigger."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK"

  deploy-production:
    name: Trigger Render Deploy (production)
    needs: build-and-push
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: >
      needs.build-and-push.result == 'success' &&
      needs.build-and-push.outputs.target-branch == 'main' &&
      (github.event_name != 'workflow_dispatch' || inputs.push_image == 'true')
    environment: production
    steps:
      - name: Call Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping deploy trigger."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK"
