name: Build & Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    # main -> production, develop -> staging. Direct pushes to either are
    # blocked by the repo's rulesets (.github/CONTRIBUTING.md §2), so a green
    # CI run here always means a PR just merged, never a stray push.
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to GHCR?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      force_rebuild:
        description: "Bypass layer cache (full rebuild)"
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the top; the build job widens its own scopes below.
permissions:
  contents: read

jobs:
  # Gate the build on docker/Dockerfile.prod existing so a checkout that
  # somehow lacks it (or a future revert) no-ops this workflow cleanly
  # instead of failing the build step.
  detect:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      has_prod_dockerfile: ${{ steps.check.outputs.has_prod_dockerfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: echo "has_prod_dockerfile=$([ -f docker/Dockerfile.prod ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Production Image
    needs: detect
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # push image to GHCR
      security-events: write   # upload Trivy SARIF
      id-token: write          # keyless signing / provenance attestation
    if: >
      needs.detect.outputs.has_prod_dockerfile == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      primary-tag: ${{ steps.meta.outputs.json && fromJSON(steps.meta.outputs.json).tags[0] }}
      # Which environment this build is for: 'main' -> production, 'develop'
      # -> staging. Resolved once here so both deploy jobs below branch on it
      # without re-deriving it from two different event shapes themselves.
      target-branch: ${{ steps.target.outputs.branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve target branch
        id: target
        run: |
          # workflow_run doesn't put the triggering branch on github.ref_name
          # (that's always the default branch); workflow_dispatch does.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags automatically lowercased)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ steps.target.outputs.branch == 'main' }}
            type=raw,value=staging,enable=${{ steps.target.outputs.branch == 'develop' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: >-
            ${{
              github.event_name != 'workflow_dispatch' ||
              inputs.push_image == 'true'
            }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ inputs.force_rebuild == true }}
          provenance: true
          sbom: true

      - name: Scan image for vulnerabilities
        id: scan
        if: steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to Security tab
        if: always() && steps.scan.outcome == 'success'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Write job summary
        if: always() && steps.build.outcome == 'success'
        run: |
          {
            echo "## 🐳 Production Image Build"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Image** | \`ghcr.io/${{ github.repository }}\` |"
            echo "| **Digest** | \`${{ steps.build.outputs.digest }}\` |"
            echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| **Platforms** | \`linux/amd64, linux/arm64\` |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # main -> production, develop -> staging (Section 1 / Section F of
  # docs/APP_AND_DEPLOYMENT_PLAN.md). Each is its own GitHub Environment so
  # the two deploy hook secrets stay scoped separately and either can get a
  # required-reviewer gate later without touching the other.
  deploy-staging:
    name: Trigger Render Deploy (staging)
    needs: build-and-push
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: >
      needs.build-and-push.result == 'success' &&
      needs.build-and-push.outputs.target-branch == 'develop'
    environment: staging
    steps:
      - name: Call Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_STAGING_DEPLOY_HOOK_URL not set — skipping deploy trigger."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK"

  deploy-production:
    name: Trigger Render Deploy (production)
    needs: build-and-push
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: >
      needs.build-and-push.result == 'success' &&
      needs.build-and-push.outputs.target-branch == 'main' &&
      (github.event_name != 'workflow_dispatch' || inputs.push_image == 'true')
    environment: production
    steps:
      - name: Call Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping deploy trigger."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 -X POST "$DEPLOY_HOOK"
