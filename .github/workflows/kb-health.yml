name: Knowledge base health

# Every Monday, ask the live Weaviate Cloud cluster one fixed question and write one small key to
# the Redis database, and fail loudly if the cluster, the collection, the embedding key or Redis
# has gone away. The weekly Redis write also keeps a free hosted Redis database from being removed
# for inactivity. No LLM is called.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: kb-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: kb-health
      - run: uv sync --frozen --no-dev
      - name: Ask the default question and keep Redis active
        env:
          WEAVIATE_URL: ${{ secrets.WEAVIATE_URL }}
          WEAVIATE_READ_API_KEY: ${{ secrets.WEAVIATE_READ_API_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: uv run --no-dev python scripts/check_knowledge_base.py
