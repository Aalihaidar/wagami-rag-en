default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # .vscode/*.json and devcontainer.json are JSONC (comments allowed).
        exclude: ^(\.vscode/|\.devcontainer/devcontainer\.json$)
      - id: detect-private-key
      - id: check-added-large-files
      - id: mixed-line-ending
        # Default is --fix=auto (whichever ending already dominates the file).
        # Pin to LF so the hook agrees with .gitattributes instead of ratifying
        # whatever a Windows editor happened to write.
        args: [--fix=lf]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        # Notebooks under notebooks/ read .env -- never let cell outputs
        # (cluster URL, key lengths, query results) reach a commit.

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6  # keep in step with the ruff floor in pyproject.toml
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert, wip]
